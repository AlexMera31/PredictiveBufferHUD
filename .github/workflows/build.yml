name: Build Predictive Buffer HUD
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          sdk: nightly
          target: Win64
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: alexmera.predictivebufferhud
          path: ${{ steps.build.outputs.build-output }}
